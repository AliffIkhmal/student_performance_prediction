<header class="sticky top-0 z-30 border-b border-outline-variant/40 bg-surface/90 backdrop-blur">
    <div class="flex flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-start gap-3">
            <button id="mobile-nav-open" type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-outline-variant/50 bg-surface-bright text-primary shadow-sm transition hover:bg-surface-container lg:hidden" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-nav-panel">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div>
            <p class="text-[11px] font-semibold uppercase tracking-[0.24em] text-secondary">{{ page_label|default:"Dashboard" }}</p>
            <h1 class="font-headline text-xl font-extrabold tracking-tight text-primary sm:text-2xl">{{ page_heading|default:page_title }}</h1>
            {% if page_description %}
                <p class="mt-1 max-w-3xl text-sm text-on-surface-variant">{{ page_description }}</p>
            {% endif %}
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="hidden rounded-full border border-outline-variant/50 bg-surface-bright px-4 py-2 md:flex md:items-center md:gap-3">
                <span class="material-symbols-outlined text-base text-on-surface-variant">search</span>
                <span class="text-sm text-on-surface-variant">Search is ready for the next backend step</span>
            </div>
            <button id="theme-toggle" type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-outline-variant/50 bg-surface-bright text-on-surface-variant shadow-sm transition hover:bg-surface-container" aria-label="Toggle dark mode">
                <span class="material-symbols-outlined theme-icon-light">dark_mode</span>
                <span class="material-symbols-outlined theme-icon-dark hidden">light_mode</span>
            </button>
            <form id="profile-image-form" method="post" enctype="multipart/form-data" action="{% url 'portal:profile_image_upload' %}" class="relative">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <input id="profile-image-input" type="file" name="profile_image" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">
                <button id="profile-image-trigger" type="button" class="relative inline-flex h-12 w-12 shrink-0 items-center justify-center rounded-[1.25rem] border border-outline-variant/50 bg-primary text-white shadow-panel" aria-label="Upload profile image">
                    <span class="absolute inset-0 overflow-hidden rounded-[1.25rem]">
                        {% if profile_image_url %}
                            <img src="{{ profile_image_url }}" alt="{{ display_username }} profile image" class="h-full w-full object-cover">
                        {% else %}
                            <span class="flex h-full w-full items-center justify-center font-headline text-base font-extrabold">{{ display_username|default:"U"|first|upper }}</span>
                        {% endif %}
                    </span>
                    <span style="position:absolute;bottom:0;right:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgb(var(--color-secondary-container));color:rgb(var(--color-primary));font-size:13px;font-weight:900;line-height:1;box-shadow:0 0 0 2px var(--badge-shadow);z-index:2;">+</span>
                </button>
            </form>
        </div>
    </div>
</header>
